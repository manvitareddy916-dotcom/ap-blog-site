<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore Andhra Pradesh</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin: 0;
      padding: 14px;
      text-align: center;
      background: #176b55;
      color: white;
    }

    #map {
      height: calc(100vh - 56px);
    }
  </style>
</head>
<body>
  <h1>Explore Andhra Pradesh</h1>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Center the map over Andhra Pradesh
    const map = L.map("map").setView([16.5, 80.6], 7);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(map);

    const places = [
      {
        name: "Visakhapatnam",
        coordinates: [17.6868, 83.2185],
        description: "Coastal city known for its beaches and port."
      },
      {
        name: "Vijayawada",
        coordinates: [16.5062, 80.6480],
        description: "A major city on the Krishna River."
      },
      {
        name: "Amaravati",
        coordinates: [16.5745, 80.3598],
        description: "Planned capital region of Andhra Pradesh."
      },
      {
        name: "Tirupati",
        coordinates: [13.6288, 79.4192],
        description: "Known for the Tirumala Venkateswara Temple."
      },
      {
        name: "Rajamahendravaram",
        coordinates: [16.9891, 81.7837],
        description: "Historic city on the Godavari River."
      },
      {
        name: "Araku Valley",
        coordinates: [18.3273, 82.8775],
        description: "Hill destination in the Eastern Ghats."
      },
      {
        name: "Srisailam",
        coordinates: [16.0740, 78.8680],
        description: "A temple town near the Nallamala Hills."
      }
    ];

    places.forEach((place) => {
      L.marker(place.coordinates)
        .addTo(map)
        .bindPopup(`<strong>${place.name}</strong><br>${place.description}`)
        .bindTooltip(place.name);
    });
  </script>
</body>
</html>
